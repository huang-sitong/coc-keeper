# coc-keeper 示例配置
# 复制为 keeper.yaml 后按需修改。
bots:
  # OneBot v11 (QQ) —— 反向 WebSocket
  - name: my-qq-bot
    adapter: aiocqhttp
    config:
      host: 0.0.0.0
      port: 2280
      # 可选 access-token，与协议端保持一致
      access-token: ""

